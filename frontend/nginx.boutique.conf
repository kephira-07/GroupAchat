# La boutique — acheteur, groupeur, livreur.
#
# Des fichiers statiques, et rien d'autre : le front ne contient aucune logique
# de serveur, il appelle l'API Django depuis le navigateur.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ────────────────────────────────────────────────────────
    #
    # Elle n'est pas decorative ici. Le §5 du cahier des charges part d'un
    # forfait de donnees limite et d'un Android d'entree de gamme : le paquet
    # JavaScript passe d'environ 467 ko a 133 ko compresse, soit les trois
    # quarts qui ne sont pas factures au visiteur.
    #
    # `gzip_vary` : indispensable des qu'un cache intermediaire est dans la
    # boucle, sinon il peut servir une reponse compressee a un client qui ne
    # sait pas la lire.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Les en-tetes de securite ───────────────────────────────────────────
    #
    # ⚠️ **Ils sont declares ICI et nulle part ailleurs, et c'est obligatoire.**
    # Dans nginx, un `add_header` place dans un `location` ne s'ajoute pas a
    # ceux du `server` : il les **remplace tous**. Le `always` n'y change rien,
    # il ne concerne que les reponses d'erreur.
    #
    # La premiere version de ce fichier posait un `add_header Cache-Control`
    # dans les deux `location` ci-dessous. Consequence : ces trois en-tetes
    # disparaissaient sur la page d'accueil et sur tous les fichiers d'assets —
    # c'est-a-dire partout ou ils servent.
    #
    # D'ou la regle, la meme que dans `vitrine/nginx.conf` : **aucun
    # `add_header` dans un `location` de ce fichier.** Le controle du cache
    # passe par `expires`, qui est une autre directive et n'affecte pas
    # l'heritage.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Cache ──────────────────────────────────────────────────────────────
    #
    # Vite donne a chaque fichier produit un nom portant une empreinte
    # (`index-DRhJWErp.js`). Le contenu d'un tel nom ne change jamais : il peut
    # donc etre garde un an.
    #
    # `expires 1y` emet `Cache-Control: max-age=31536000` tout seul.
    #
    # ⚠️ **`immutable` est perdu**, et c'est le prix assume de la regle
    # ci-dessus : cette directive ne s'obtient que par un `add_header`, qui
    # ferait tomber les trois en-tetes de securite sur tous les assets. Son
    # apport se limitait a eviter une revalidation lors d'un rechargement
    # manuel de la page ; `max-age` fait tout le reste du travail.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # ⚠️ **La page, elle, ne se met jamais en cache.** C'est elle qui nomme les
    # fichiers a empreinte : si un navigateur la garde, il continue de demander
    # l'ancien JavaScript apres un deploiement, et le visiteur reste sur la
    # version precedente sans aucun moyen de le savoir.
    #
    # `expires -1` emet `Cache-Control: no-cache` sans `add_header`.
    location = /index.html {
        expires -1;
    }

    # ⚠️ **`/admin.html` est refuse ici**, exactement comme le greffon
    # `masquerAdmin` de `vite.config.ts` le fait en developpement.
    #
    # Ce paquet ne contient de toute facon pas l'administration — `dist/` et
    # `dist-admin/` sont construits separement — mais la regle rend la
    # frontiere explicite et identique dans les deux environnements. Sans elle,
    # le `try_files` ci-dessous renverrait la boutique pour cette adresse, ce
    # qui laisserait croire qu'il s'y trouve quelque chose.
    #
    # Il est declare **avant** `location /` : nginx choisit `= /admin.html` en
    # priorite de toute facon (une correspondance exacte gagne), mais l'ordre
    # de lecture suit alors l'ordre d'evaluation.
    location = /admin.html {
        return 404;
    }

    # ── Le site de presentation ────────────────────────────────────────────
    #
    # Il vit dans `frontend/public/presentation/`, donc Vite le recopie tel
    # quel a la racine du paquet et nginx le sert sans rien de particulier.
    #
    # ⚠️ **Deux raisons de lui donner son propre bloc** plutot que de le
    # laisser au `location /` ci-dessous :
    #
    # - **le cache.** Ses fichiers n'ont pas de nom a empreinte : `styles.css`
    #   s'appellera toujours `styles.css` et son contenu change a chaque
    #   correction. La regle d'un an de `/assets/` y servirait l'ancienne
    #   feuille de style pendant des mois. Une heure, donc ;
    # - **les 404.** Le `try_files` du `location /` renvoie `index.html`, soit
    #   **l'application** : une adresse fautive sous `/presentation/` afficherait
    #   la boutique au lieu d'une erreur. `=404` dit la verite.
    location /presentation/ {
        expires 1h;
        try_files $uri $uri/ =404;
    }

    # ── Les routes ─────────────────────────────────────────────────────────
    #
    # `try_files … /index.html` : le front enchaine ses ecrans sans
    # bibliotheque de routage et sans adresse profonde, donc il n'y a en
    # pratique qu'une seule page a servir. Ce repli garantit qu'une adresse
    # tapee de travers ramene l'application plutot qu'un 404 nu — et il reste
    # correct si un routeur est ajoute plus tard.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
