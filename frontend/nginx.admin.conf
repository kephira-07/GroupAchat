# L'administration — ecrans A1 et A2.
#
# ⚠️ **La page s'appelle `admin.html`, pas `index.html`.** C'est la
# particularite de ce paquet, et la source d'erreur la plus probable : avec la
# configuration par defaut de nginx, la racine du site renverrait **403
# Forbidden**, nginx cherchant un `index.html` que `dist-admin/` ne contient
# pas. Les deux directives `index` et `try_files` ci-dessous le nomment donc
# explicitement.
#
# ⚠️ **Rien ici n'authentifie personne.** Cette application s'ouvre sans mot de
# passe, et le fera jusqu'au branchement de l'authentification. L'ecran A1
# n'affiche aucune donnee personnelle, mais **l'ecran A2 affiche des noms, des
# numeros et des references de pieces d'identite** — ce qui est protege
# aujourd'hui, c'est la route `/api/dossiers/` du backend, par le jeton
# `X-Jeton-Admin`. Autrement dit : la page se montre, les donnees ne viennent
# pas sans le jeton.
#
# **Avant toute mise en ligne**, cette image doit etre fermee au reseau
# public : reseau prive, VPN, ou a defaut une authentification HTTP posee ici
# (`auth_basic`). Ne pas la publier sur un port ouvert d'Internet. C'est aussi
# pourquoi `docker-compose.yml` lie son port a `127.0.0.1` seulement.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index admin.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Les en-tetes ───────────────────────────────────────────────────────
    #
    # ⚠️ **Tous declares ICI, et aucun `add_header` dans un `location`.** Dans
    # nginx, un `add_header` place dans un `location` ne s'ajoute pas a ceux du
    # `server` : il les **remplace tous**.
    #
    # L'erreur etait particulierement grave sur ce fichier-ci. La premiere
    # version posait un `add_header Cache-Control` dans `location /assets/`,
    # ce qui y faisait tomber le `X-Robots-Tag` — c'est-a-dire exactement sur
    # les fichiers pour lesquels il est indispensable, puisqu'un robot qui
    # demande un `.js` ou un `.css` ne lit aucun HTML et ne voit donc jamais la
    # balise `<meta name="robots">` d'`admin.html`. L'en-tete etait pose
    # partout sauf la ou la balise ne suffit pas.
    #
    # Le controle du cache passe donc par `expires`, qui est une autre
    # directive et n'affecte pas l'heritage.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    # `DENY` et non `SAMEORIGIN` : un outil interne n'a aucune raison d'etre
    # place dans un cadre, et l'interdire ferme le detournement de clic.
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Cache ──────────────────────────────────────────────────────────────
    #
    # Noms a empreinte produits par Vite : le contenu ne change jamais sous un
    # nom donne. `expires 1y` emet `Cache-Control: max-age=31536000`.
    # `immutable` est perdu, pour la raison dite plus haut — il ne s'obtient
    # que par un `add_header`.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # La page nomme les fichiers a empreinte : la mettre en cache ferait rester
    # un administrateur sur l'ancienne version apres un deploiement.
    # `expires -1` emet `Cache-Control: no-cache`.
    location = /admin.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /admin.html;
    }
}
